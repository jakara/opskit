name: opskit

x-internal-logging: &internal-logging
  driver: fluentd
  options:
    fluentd-address: "127.0.0.1:${OPSKIT_LOG_FORWARD_PORT:-24224}"
    fluentd-async: "true"
    fluentd-sub-second-precision: "true"
    labels: "opskit.service"
    tag: opskit
    mode: non-blocking
    max-buffer-size: 16m

# 仅部署在管理机；外层 Nginx 终止 HTTPS，本模块只提供 HTTP。
services:
  workbench:
    image: ${WORKBENCH_IMAGE:-m.daocloud.io/docker.io/library/python:3.12-alpine}
    restart: unless-stopped
    labels: {opskit.service: workbench}
    logging: *internal-logging
    command: ["python", "-u", "/app/server.py", "--bind", "0.0.0.0", "--port", "8090", "--data", "/data", "--discovery-file", "/discovery/state.json", "--seed-tools", "--documents-dir", "/documents"]
    environment:
      OPSKIT_AUTH_FILE: /run/opskit/operator.json
      OPSKIT_COMPONENT_AUTH_FILE: /run/opskit/components.json
      NPM_ADMIN_PORT: ${NPM_ADMIN_PORT:-8181}
      SPUG_HTTP_PORT: ${SPUG_HTTP_PORT:-8081}
    volumes:
      - ./portal:/app:ro
      - workbench-data:/data
      - ./.workbench/discovery:/discovery:ro
      - ./documents:/documents:ro
      - ./.workbench/auth/operator.json:/run/opskit/operator.json:ro
      - ./.workbench/auth/components.json:/run/opskit/components.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; c=http.client.HTTPConnection('127.0.0.1',8090); c.request('GET','/healthz'); assert c.getresponse().status==200"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [management]

  proxy-manager:
    image: ${NPM_IMAGE:-m.daocloud.io/docker.io/jc21/nginx-proxy-manager:2.16.0}
    restart: unless-stopped
    labels: {opskit.service: proxy-manager}
    logging: *internal-logging
    depends_on:
      workbench:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      DISABLE_IPV6: "true"
      IP_RANGES_FETCH_ENABLED: "false"
    ports:
      - "${OPSKIT_BIND_IP:-127.0.0.1}:${OPSKIT_HTTP_PORT:-80}:80"
      - "${NPM_BIND_IP:-127.0.0.1}:${NPM_ADMIN_PORT:-8181}:81"
    volumes:
      - npm-data:/data
      # NPM 镜像启动时要求挂载该目录；本包不申请证书，也不开放 443。
      - npm-cert-store:/etc/letsencrypt
      - ./portal:/opskit/portal:ro
      - ./ui/npm:/app/frontend:ro
    networks: [management]

  spug:
    image: ${SPUG_IMAGE:-ghcr.io/openspug/spug:4.1}
    restart: unless-stopped
    labels: {opskit.service: spug}
    logging: *internal-logging
    ports:
      - "${OPSKIT_BIND_IP:-127.0.0.1}:${SPUG_HTTP_PORT:-8081}:80"
    environment:
      TZ: Asia/Shanghai
      MYSQL_HOST: spugdb
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: spug
      MYSQL_USER: spug
      MYSQL_PASSWORD: ${SPUG_DB_PASSWORD:?请先运行安装向导}
      SPUG_ADMIN_USER: ${SPUG_ADMIN_USER:-admin}
      SPUG_ADMIN_PASSWORD: ${SPUG_ADMIN_PASSWORD:?请先运行安装向导}
    volumes:
      - spug-data:/data
      - ./ui/spug:/opt/spug/spug_web/build:ro
      - ./spug/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./spug/start-api.sh:/opt/spug/spug_api/tools/start-api.sh:ro
      - ./scripts/control_client.py:/opt/opskit/control_client.py:ro
      - ./.workbench/control/requests:/opskit-control/requests
      - ./.workbench/control/results:/opskit-control/results:ro
      - ./.workbench/control/status:/opskit-control/status:ro
    depends_on:
      spugdb:
        condition: service_healthy
    networks: [management]

  spugdb:
    image: ${MARIADB_IMAGE:-m.daocloud.io/docker.io/library/mariadb:10.11}
    restart: unless-stopped
    labels: {opskit.service: spugdb}
    logging: *internal-logging
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MARIADB_DATABASE: spug
      MARIADB_USER: spug
      MARIADB_PASSWORD: ${SPUG_DB_PASSWORD:?请先运行安装向导}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - spug-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [management]

  dbx:
    image: ${DBX_IMAGE:-docker.cnb.cool/dbxio.com/dbx:0.6.40}
    restart: unless-stopped
    labels: {opskit.service: dbx}
    logging: *internal-logging
    environment:
      DBX_PASSWORD: ${DBX_PASSWORD:?请先运行安装向导}
      DBX_DISABLE_PASSWORD: "false"
      DBX_DISABLE_PASSWORD_VIEWER: "true"
      DBX_PUBLIC_BASE_PATH: /dbx
      DBX_BACKUP_ROOT: /app/backups
      # 默认不开放远程 MCP；扩展说明见 ai/README.md。
    volumes:
      - dbx-data:/app/data
      - dbx-backups:/app/backups
    networks: [management]

  victorialogs:
    image: ${VICTORIALOGS_IMAGE:-m.daocloud.io/docker.io/victoriametrics/victoria-logs:v1.53.0}
    restart: unless-stopped
    labels: {opskit.service: victorialogs}
    logging: *internal-logging
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=${LOG_RETENTION_DAYS:-14}d
      - -http.pathPrefix=/logs
    volumes:
      - vlogs-data:/victoria-logs-data
    networks: [management]

  internal-logs:
    image: ${FLUENTBIT_IMAGE:-m.daocloud.io/docker.io/fluent/fluent-bit:5.1.4}
    restart: unless-stopped
    # 采集器自身日志保留在 Docker，避免把发送故障再送回自身形成循环。
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}
    environment:
      HOST_ID: ${OPS_PUBLIC_HOST:-ops.example.internal}
    ports:
      - "127.0.0.1:${OPSKIT_LOG_FORWARD_PORT:-24224}:24224"
    volumes:
      - ./internal-logs.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - internal-logs-data:/fluent-bit/state
      - npm-data:/sources/npm:ro
      - spug-data:/sources/spug:ro
    depends_on: [victorialogs]
    networks: [management]

networks:
  management:
    driver: bridge

volumes:
  workbench-data:
  npm-data:
  npm-cert-store:
  spug-data:
  spug-db:
  dbx-data:
  dbx-backups:
  vlogs-data:
  internal-logs-data:
