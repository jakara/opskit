# 仅安装 Hub 和 NPM；共用完整管理中心的服务定义。
name: opskit-hub
services:
  workbench:
    extends:
      file: compose.yaml
      service: workbench
    environment:
      OPSKIT_COMPONENTS: npm
    logging: {driver: local, options: {max-size: 10m, max-file: "3"}}
    volumes:
      - ./.workbench/hub:/data
      - ./.workbench/auth/hub-operator.json:/run/opskit/operator.json:ro
      - ./.workbench/auth/hub-components.json:/run/opskit/components.json:ro
  proxy-manager:
    extends:
      file: compose.yaml
      service: proxy-manager
    logging: {driver: local, options: {max-size: 10m, max-file: "3"}}
networks:
  management:
    driver: bridge
volumes:
  npm-data:
  npm-cert-store:
