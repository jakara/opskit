[SERVICE]
    Flush             2
    Daemon            Off
    Log_Level         info
    HTTP_Server       On
    HTTP_Listen       0.0.0.0
    HTTP_Port         2020
    Health_Check      On
    storage.path      /fluent-bit/state
    storage.sync      normal

[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224
    storage.type      filesystem

[INPUT]
    Name              tail
    Tag               opskit.npm-files
    Path              /sources/npm/logs/*.log
    DB                /fluent-bit/state/npm-tail.db
    Read_from_Head    Off
    Refresh_Interval  2
    Skip_Long_Lines   On
    storage.type      filesystem

[INPUT]
    Name              tail
    Tag               opskit.spug-files
    Path              /sources/spug/spug/spug_api/logs/*.log
    DB                /fluent-bit/state/spug-tail.db
    Read_from_Head    Off
    Refresh_Interval  2
    Skip_Long_Lines   On
    storage.type      filesystem

[FILTER]
    Name              modify
    Match             *
    Condition         Key_value_matches log .*GENERATED.ROOT.PASSWORD.*
    Set               log OPSKIT_MARIADB_ROOT_PASSWORD_REDACTED

[FILTER]
    Name              modify
    Match             *
    Condition         Key_value_matches log .*(x-token=|access_token=|password=|secret=).*
    Set               log OPSKIT_CREDENTIAL_URL_REDACTED

[FILTER]
    Name              modify
    Match             *
    Rename            opskit.service app

[FILTER]
    Name              record_modifier
    Match             opskit.npm-files
    Record            app proxy-manager

[FILTER]
    Name              record_modifier
    Match             opskit.spug-files
    Record            app spug

[FILTER]
    Name              record_modifier
    Match             *
    Record            project opskit
    Record            host ${HOST_ID}
    Record            env management

[OUTPUT]
    Name              http
    Match             *
    Host              victorialogs
    Port              9428
    URI               /logs/insert/jsonline?_stream_fields=project,host,app,env&_msg_field=log&_time_field=date
    Format            json_lines
    Json_Date_Key     date
    Json_Date_Format  iso8601
    Retry_Limit       False
    storage.total_limit_size 1G
