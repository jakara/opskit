[SERVICE]
    Flush            5
    Daemon           Off
    Log_Level        info
    storage.path     /fluent-bit/state
    storage.sync     normal

[INPUT]
    Name             tail
    Tag              app.logs
    Path             /hostlogs/${LOG_FILE_PATTERN}
    DB               /fluent-bit/state/tail.db
    Read_from_Head   Off
    Refresh_Interval 5
    Skip_Long_Lines  On
    storage.type     filesystem

[FILTER]
    Name             record_modifier
    Match            *
    Record           host ${HOST_ID}
    Record           project ${PROJECT_ID}
    Record           app ${APP_ID}
    Record           env ${APP_ENV}

[OUTPUT]
    Name             http
    Match            *
    Host             ${OPS_HOST}
    Port             ${OPS_PORT}
    Header           Host ${OPS_VHOST}
    Allow_Duplicated_Headers False
    Uri              /logs/insert/jsonline?_stream_fields=project,host,app,env&_msg_field=log&_time_field=date
    Format           json_lines
    Json_Date_Key    date
    Json_Date_Format iso8601
    HTTP_User        ${LOG_AGENT_USER}
    HTTP_Passwd      ${LOG_AGENT_PASSWORD}
    tls              ${OPS_TLS}
    tls.verify       On
    tls.verify_hostname On
    Retry_Limit      False
    storage.total_limit_size 1G
