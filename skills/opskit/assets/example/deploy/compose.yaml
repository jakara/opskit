services:
  web:
    image: python:3.12-alpine
    restart: unless-stopped
    command: [python, -u, /app/server.py]
    environment:
      APP_VERSION: ${APP_VERSION:?请填写演练版本}
    ports:
      - "127.0.0.1:${HTTP_PORT:?请填写演练端口}:8080"
    volumes:
      - ./server.py:/app/server.py:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8080/healthz').status == 200"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks: [application]
networks:
  application:
    driver: bridge
